# PR validation: restore, build and test the solution.
# Skips the build and test steps while the tree has no .csproj files.
name: pr-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Restore, build, per-project unit tests. The required check "pr-validation" is the aggregate job at the end of this file.
  unit:
    name: unit (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repo guards
        run: scripts/check-kernel-size.sh

      - name: Detect projects
        id: detect
        run: |
          if git ls-files '*.csproj' | grep -q .; then
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
            echo "No .csproj in the tree yet: restore, build and test skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up .NET SDK from global.json
        if: steps.detect.outputs.has_projects == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.detect.outputs.has_projects == 'true'
        run: dotnet restore MiroClone.sln

      - name: Build
        if: steps.detect.outputs.has_projects == 'true'
        run: dotnet build MiroClone.sln --no-restore --configuration Release

      # The browser journeys run in their own job (e2e below), so the unit job never starts a browser or the estate. Each unit test
      # project runs on its own: a filter would leave the excluded project with zero tests, which the runner reports as a failure.
      - name: Test
        if: steps.detect.outputs.has_projects == 'true'
        run: |
          for project in $(git ls-files 'tests/*.csproj' | grep -v -e 'MiroClone.Web.E2E' -e 'MiroClone.TestSupport'); do
            dotnet test --project "$project" --no-build --configuration Release
          done

  # Browser journeys against the whole estate, started by the suite from the AppHost (WP12, ADR 0039). Docker is on the runner,
  # so PostgreSQL and the pinned authservice image run here. MIROCLONE_E2E_REQUIRED makes a missing browser or Docker fail the job
  # instead of skipping the journeys.
  e2e:
    name: e2e (browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIROCLONE_E2E_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MiroClone.sln

      - name: Build
        run: dotnet build MiroClone.sln --no-restore --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh tests/MiroClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Journeys
        run: dotnet test --project tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --no-build --configuration Release

  # Builds each service image without pushing it. A Dockerfile that breaks is caught here, not at the tag (WP13).
  docker-build:
    name: docker-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: boards
            dockerfile: MiroClone.BoardsService/Dockerfile
          - service: canvas
            dockerfile: MiroClone.CanvasService/Dockerfile
          - service: web
            dockerfile: MiroClone.Web/Dockerfile
          - service: seed
            dockerfile: MiroClone.Seed/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=pr-validation-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pr-validation-${{ matrix.service }}

  # The estate in containers, built from the Dockerfiles and started by compose.yaml (the same wiring as the AppHost), then the
  # browser journeys against it: register through authservice, sign in, create a board, draw, and a second user in the same
  # workspace sees the live shape and cursor (ADR 0049). Aspire's DCP does not run on GitHub runners, which is why compose is used.
  compose-e2e:
    name: compose-e2e (containers and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIROCLONE_E2E_REQUIRED: "1"
      MIROCLONE_E2E_AUTHENTICATED: "1"
      MIROCLONE_E2E_SEEDED: "1"
      MIROCLONE_E2E_BASE_URL: http://127.0.0.1:8080
      MIROCLONE_E2E_AUTHSERVICE_URL: http://127.0.0.1:5080
      MIROCLONE_E2E_AUTHSERVICE_CONTAINER: miroclone-authservice-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the estate (build images, wait for healthy)
        run: scripts/compose-up.sh

      - name: Container state
        if: always()
        run: docker compose ps -a

      # Evidence for the real authservice container (ADR 0050): its startup log, its health, and the seed's result over the public APIs.
      - name: authservice startup log, health and seed check
        run: |
          {
            echo '### authservice (ghcr.io/konradcinkusz/authservice:v0.3.4) in compose'
            echo '```'
            docker compose logs --no-color authservice | head -n 60
            echo '--- GET /health/ready ---'
            curl -sS -i http://127.0.0.1:5080/health/ready
            echo
            echo '--- seed container log ---'
            docker compose logs --no-color seed
            echo '--- scripts/verify-seed.sh ---'
            scripts/verify-seed.sh
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/verify-seed.sh > /dev/null

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the journeys
        run: dotnet build tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh tests/MiroClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Journeys against the containers
        run: dotnet test --project tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --no-build --configuration Release

      - name: Container logs
        if: always()
        run: |
          mkdir -p compose-logs
          echo "--- tail of each service log (the full logs are in the compose-logs artifact) ---"
          for service in authservice seed boards-service canvas-service web; do
            echo "=== $service ==="; docker compose logs --no-color --tail 40 "$service" 2>&1 || true
          done
          for service in postgres authservice seed boards-service canvas-service web; do
            docker compose logs --no-color "$service" > "compose-logs/$service.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs
          if-no-files-found: ignore

      - name: Stop the estate
        if: always()
        run: docker compose down -v

  # The Aspire path itself: the AppHost starts on the runner (Development, so it seeds), then the same checks and the seeded journeys run
  # against it. Earlier findings said Aspire's DCP does not run on GitHub runners (ADR 0049); this job is the experiment that checks
  # the claim and, where it holds, the proof of the AppHost path. It is not part of the required aggregate until the result is recorded
  # in ADR 0050, so a DCP failure shows as this job's own red or amber and never as a skipped test.
  apphost-e2e:
    name: apphost-e2e (Aspire AppHost and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      MIROCLONE_E2E_REQUIRED: "1"
      MIROCLONE_E2E_AUTHENTICATED: "1"
      MIROCLONE_E2E_SEEDED: "1"
      MIROCLONE_E2E_BASE_URL: http://127.0.0.1:8080
      MIROCLONE_E2E_AUTHSERVICE_URL: http://127.0.0.1:5080
      MIROCLONE_E2E_AUTHSERVICE_CONTAINER: miroclone-authservice-apphost
      AUTHSERVICE_URL: http://127.0.0.1:5080
      BOARDS_URL: http://127.0.0.1:5081
      CANVAS_URL: http://127.0.0.1:5082
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # One build first: the AppHost starts the services and the seed as parallel `dotnet run` builds of the shared ServiceDefaults project,
      # which collide on its deps file ("GenerateDepsFile ... file in use") and leave a service unstarted (ADR 0050).
      - name: Build the estate once (Debug, as the AppHost runs it)
        run: dotnet build MiroClone.sln --nologo -v quiet

      - name: Start the AppHost (http launch profile, Development, seed on)
        run: |
          key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048)"
          nohup env DOTNET_ENVIRONMENT=Development ASPNETCORE_ENVIRONMENT=Development "Parameters__authservice-jwt-private-key=$key" Estate__WebPort=8080 Estate__AuthServicePort=5080 Estate__BoardsPort=5081 Estate__CanvasPort=5082 Estate__EphemeralData=true \
            dotnet run --project MiroClone.AppHost > apphost.log 2>&1 &
          echo $! > apphost.pid
          deadline=$((SECONDS + 420))
          while (( SECONDS < deadline )); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health > /dev/null 2>&1; then echo "web healthy after ${SECONDS}s"; exit 0; fi
            if ! kill -0 "$(cat apphost.pid)" 2> /dev/null; then echo "the AppHost exited"; break; fi
            sleep 3
          done
          echo "::group::diagnostics: the web app did not become healthy"
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          ps -eo pid,etime,args | grep -E 'MiroClone|dcp' | grep -v grep | cut -c1-200 || true
          echo '--- apphost.log (tail) ---'; tail -n 60 apphost.log
          for f in ~/.aspire/logs/*.log; do echo "--- $f (tail) ---"; tail -n 60 "$f"; done
          for f in /tmp/aspire*/* /tmp/dcp*/* ~/.aspire/dcp/* ; do [ -f "$f" ] && { echo "--- $f (tail) ---"; tail -n 40 "$f"; }; done 2> /dev/null || true
          echo "::endgroup::"
          exit 1

      - name: Container state and the AppHost log
        if: always()
        run: |
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          echo '--- apphost.log (tail) ---'; tail -n 60 apphost.log || true

      # The seed is a project resource of the AppHost. It runs after authservice, boards and canvas are healthy; the web app does not wait
      # for it, so this waits until both users see the demo boards (verify-seed.sh), then records the evidence.
      - name: authservice startup log, health and seed check
        run: |
          for attempt in $(seq 1 45); do
            if scripts/verify-seed.sh > verify.log 2>&1; then break; fi
            sleep 4
            if (( attempt == 10 )); then
              echo '::group::the AppHost seed did not leave the demo data; its DCP log and a manual run of the same program'
              find /tmp -path '*seed*' -type f -name '*' 2> /dev/null | head -20 | while read -r f; do echo "--- $f ---"; tail -n 40 "$f"; done
              AUTHSERVICE_CONTAINER=miroclone-authservice-apphost scripts/seed-dev-users.sh || echo "manual seed exit code $?"
              echo '::endgroup::'
            fi
          done
          {
            echo '### authservice (ghcr.io/konradcinkusz/authservice:v0.3.4) under the Aspire AppHost'
            echo '```'
            docker logs miroclone-authservice-apphost 2>&1 | head -n 60
            echo '--- GET /health/ready ---'
            curl -sS -i http://127.0.0.1:5080/health/ready
            echo
            echo '--- scripts/verify-seed.sh ---'
            scripts/verify-seed.sh
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/verify-seed.sh > /dev/null

      - name: Install Chromium for Playwright
        run: |
          dotnet build tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --configuration Release
          pwsh tests/MiroClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Journeys against the AppHost
        run: dotnet test --project tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --no-build --configuration Release --filter-class "*SeededJourneyTests" --filter-class "*BoardJourneyTests"

      - name: Logs
        if: always()
        run: |
          echo '--- aspire CLI logs ---'; tail -n 120 ~/.aspire/logs/*.log 2>/dev/null || true
          echo '--- verify.log ---'; cat verify.log 2>/dev/null || true
          docker logs miroclone-authservice-apphost 2>&1 | head -n 80 || true
          tail -n 200 apphost.log || true

      - name: Stop the AppHost
        if: always()
        run: |
          kill "$(cat apphost.pid)" 2> /dev/null || true
          docker ps -aq | xargs -r docker rm -f || true

  # The required check. It passes only when every job above passed, so branch protection on "pr-validation" counts the unit tests,
  # the in-process journeys, the container journeys and the image builds.
  pr-validation:
    name: pr-validation
    runs-on: ubuntu-latest
    needs: [unit, e2e, compose-e2e, docker-build]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.unit.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.compose-e2e.result }}" = success
          test "${{ needs.docker-build.result }}" = success
