# PR validation: restore, build and test the solution.
# Skips the build and test steps while the tree has no .csproj files.
name: pr-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Restore, build, per-project unit tests. The required check "pr-validation" is the aggregate job at the end of this file.
  unit:
    name: unit (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repo guards
        run: scripts/check-kernel-size.sh

      - name: Detect projects
        id: detect
        run: |
          if git ls-files '*.csproj' | grep -q .; then
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
            echo "No .csproj in the tree yet: restore, build and test skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up .NET SDK from global.json
        if: steps.detect.outputs.has_projects == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.detect.outputs.has_projects == 'true'
        run: dotnet restore MiroClone.sln

      - name: Build
        if: steps.detect.outputs.has_projects == 'true'
        run: dotnet build MiroClone.sln --no-restore --configuration Release

      # The browser journeys run in their own job (e2e below), so the unit job never starts a browser or the estate. Each unit test
      # project runs on its own: a filter would leave the excluded project with zero tests, which the runner reports as a failure.
      - name: Test
        if: steps.detect.outputs.has_projects == 'true'
        run: |
          for project in $(git ls-files 'tests/*.csproj' | grep -v -e 'MiroClone.Web.E2E' -e 'MiroClone.TestSupport'); do
            dotnet test --project "$project" --no-build --configuration Release
          done

  # Browser journeys against the whole estate, started by the suite from the AppHost (WP12, ADR 0039). Docker is on the runner,
  # so PostgreSQL and the pinned authservice image run here. MIROCLONE_E2E_REQUIRED makes a missing browser or Docker fail the job
  # instead of skipping the journeys.
  e2e:
    name: e2e (browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIROCLONE_E2E_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MiroClone.sln

      - name: Build
        run: dotnet build MiroClone.sln --no-restore --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh tests/MiroClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Journeys
        run: dotnet test --project tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --no-build --configuration Release

  # Builds each service image without pushing it. A Dockerfile that breaks is caught here, not at the tag (WP13).
  docker-build:
    name: docker-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: boards
            dockerfile: MiroClone.BoardsService/Dockerfile
          - service: canvas
            dockerfile: MiroClone.CanvasService/Dockerfile
          - service: web
            dockerfile: MiroClone.Web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha,scope=pr-validation-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pr-validation-${{ matrix.service }}

  # The estate in containers, built from the Dockerfiles and started by compose.yaml (the same wiring as the AppHost), then the
  # browser journeys against it: register through authservice, sign in, create a board, draw, and a second user in the same
  # workspace sees the live shape and cursor (ADR 0049). Aspire's DCP does not run on GitHub runners, which is why compose is used.
  compose-e2e:
    name: compose-e2e (containers and browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIROCLONE_E2E_REQUIRED: "1"
      MIROCLONE_E2E_AUTHENTICATED: "1"
      MIROCLONE_E2E_BASE_URL: http://127.0.0.1:8080
      MIROCLONE_E2E_AUTHSERVICE_URL: http://127.0.0.1:5080
      MIROCLONE_E2E_AUTHSERVICE_CONTAINER: miroclone-authservice-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the estate (build images, wait for healthy)
        run: scripts/compose-up.sh

      - name: Container state
        if: always()
        run: docker compose ps -a

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the journeys
        run: dotnet build tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh tests/MiroClone.Web.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Journeys against the containers
        run: dotnet test --project tests/MiroClone.Web.E2E/MiroClone.Web.E2E.csproj --no-build --configuration Release

      - name: Container logs
        if: always()
        run: |
          mkdir -p compose-logs
          echo "--- tail of each service log (the full logs are in the compose-logs artifact) ---"
          for service in authservice boards-service canvas-service web; do
            echo "=== $service ==="; docker compose logs --no-color --tail 40 "$service" 2>&1 || true
          done
          for service in postgres authservice boards-service canvas-service web; do
            docker compose logs --no-color "$service" > "compose-logs/$service.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs
          if-no-files-found: ignore

      - name: Stop the estate
        if: always()
        run: docker compose down -v

  # The required check. It passes only when every job above passed, so branch protection on "pr-validation" counts the unit tests,
  # the in-process journeys, the container journeys and the image builds.
  pr-validation:
    name: pr-validation
    runs-on: ubuntu-latest
    needs: [unit, e2e, compose-e2e, docker-build]
    if: always()
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.unit.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.compose-e2e.result }}" = success
          test "${{ needs.docker-build.result }}" = success
