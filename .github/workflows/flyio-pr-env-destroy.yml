# Teardown of a pull request's preview estate (WP13, pr-preview-environments §5). Two triggers:
#   1. automatic, when the PR closes (merged or not);
#   2. manual, with a PR number, for orphans left by a workflow bug or a renamed app.
# Every step is idempotent: a missing app or database is a skip, so a half-destroyed preview can be destroyed again.
name: flyio-pr-env-destroy

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request whose preview to destroy.
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-env-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  PG_APP: miroclone-postgres-dev

jobs:
  destroy:
    name: destroy preview
    # Fork PRs have no secrets, and their preview was never deployed.
    if: vars.FLYIO_PREVIEWS == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: dev-fly
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy the preview apps
        run: |
          set -euo pipefail
          for service in web boards canvas authservice; do
            app="miroclone-${service}-pr-${PR_NUMBER}"
            if flyctl apps list --json | jq -e --arg a "$app" 'any(.[]; (.Name // .name) == $a)' >/dev/null; then
              flyctl apps destroy "$app" --yes
            else
              echo "$app does not exist: skipped"
            fi
          done

      - uses: actions/checkout@v4

      - name: Drop the preview databases and role
        run: scripts/flyio-pr-database.sh drop "$PR_NUMBER" "$PG_APP"

      - name: Mark the sticky comment as destroyed
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- miroclone-pr-env -->';
            const pr = context.issue.number;
            const body = [
              marker,
              '### Preview environment',
              '',
              'Destroyed: the pull request closed. Its apps and databases were removed.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const mine = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            }
